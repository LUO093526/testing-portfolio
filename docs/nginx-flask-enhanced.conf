# ============================================================
# Nginx 反向代理 — Flask API（生产增强版）
# 第4周 Day3: 日志 / 安全头 / Gzip / 限流
# ============================================================

# ---------- 限流区定义（全局）----------
# 每个IP每秒最多10个请求，突发不超过20个
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

# ---------- 上游服务器定义 ----------
upstream flask_backend {
    server 127.0.0.1:5000 max_fails=3 fail_timeout=30s;
    keepalive 16;   # 保持连接池
}

# ---------- 主站点 ----------
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name localhost;

    # ========== 日志配置 ==========
    # 自定义日志格式：记录响应时间、上游地址
    log_format timing '$remote_addr - $remote_user [$time_local] '
                      '"$request" $status $body_bytes_sent '
                      '"$http_referer" "$http_user_agent" '
                      'rt=$request_time uct=$upstream_connect_time '
                      'uht=$upstream_header_time';

    access_log /var/log/nginx/flask-access.log timing;
    error_log  /var/log/nginx/flask-error.log warn;

    # ========== 基础安全头 ==========
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ========== Gzip 压缩 ==========
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        application/json
        application/javascript
        text/css
        text/plain
        text/xml;
    gzip_vary on;
    gzip_proxied any;

    # ========== 反向代理：API → Flask ==========
    location /api/ {
        # 限流
        limit_req zone=api_limit burst=20 nodelay;
        limit_req_status 429;

        # 代理到上游
        proxy_pass http://flask_backend;
        proxy_http_version 1.1;                    # HTTP/1.1 支持 keepalive
        proxy_set_header Connection "";

        # 请求头转发
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 超时
        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;

        # 缓冲
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 16k;

        # 失败重试（GET/HEAD 安全幂等）
        proxy_next_upstream error timeout invalid_header http_502 http_503;
        proxy_next_upstream_tries 2;
    }

    # ========== 健康检查（无需代理，直接返回）==========
    location /api/health {
        # 健康检查不限流
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://flask_backend;
    }

    # ========== 静态页面 ==========
    location / {
        root /var/www/html;
        index index.html index.htm;
    }

    # ========== 禁止访问隐藏文件 ==========
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
